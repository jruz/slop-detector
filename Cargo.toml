[package]
name = "slop-detector"
version = "0.1.0"
edition = "2024"
license = "EUPL-1.2+"

[[bin]]
name = "slop-detector"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
color-eyre = "=0.6.5"
hcl = { version = "=0.20.0", package = "hcl-rs" }
ignore = "=0.4.34"
lightningcss = "=1.0.0-alpha.70"
miette = "=7.6.0"
nu-cmd-extra = { version = "0.112.2", default-features = false }
nu-cmd-lang = { version = "0.112.2", default-features = false, features = [
  "os",
] }
nu-command = { version = "0.112.2", default-features = false, features = [
  "os",
] }
nu-parser = "0.112.2"
nu-protocol = { version = "0.112.2", default-features = false }
nu-std = { version = "0.112.2", default-features = false }
oxc = "=0.110.0"
oxc_ast_visit = "=0.110.0"
ra_ap_syntax = "=0.0.362"
rnix = "=0.15.1"
rowan = "=0.17.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde-saphyr = "=2.1.1"
serde_json = "=1.0.154"
thiserror = "=2.0.21"
time = { version = "=0.3.55", features = ["formatting"] }
toml = "=1.2.1"
tree-sitter = "=0.24.7"
tree-sitter-gleam = "=1.0.0"
tree-sitter-just = "=0.1.0"
tree-sitter-swift = "=0.6.0"

[build-dependencies]
thiserror = "=2.0.21"

[lints.rust]
future_incompatible = "forbid"
keyword_idents = "forbid"
let_underscore = "forbid"
nonstandard_style = { level = "deny", priority = -1 }
refining_impl_trait = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = "forbid"
unsafe_code = "forbid"
unused = { level = "deny", priority = -1 }
warnings = "deny"

[lints.clippy]
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
restriction = { level = "deny", priority = -1 }

# all projects
absolute_paths = "allow"
arithmetic_side_effects = "allow"
blanket_clippy_restriction_lints = "allow"
cargo_common_metadata = "allow"
error_impl_error = "allow"
exhaustive_structs = "allow"
expect_used = "allow"
implicit_return = "allow"
missing_const_for_fn = "allow"
missing_docs_in_private_items = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
mod_module_files = "allow"
multiple_crate_versions = "allow"
option_if_let_else = "allow"
pattern_type_mismatch = "allow"
question_mark_used = "allow"
separated_literal_suffix = "allow"
shadow_reuse = "allow"
single_call_fn = "allow"
std_instead_of_alloc = "allow"
std_instead_of_core = "allow"
str_to_string = "allow"
struct_excessive_bools = "allow"

# this project
arbitrary_source_item_ordering = "allow"
missing_trait_methods = "allow"
print_stdout = "allow"
renamed_function_params = "allow"
wildcard_enum_match_arm = "allow"
exhaustive_enums = "allow"
missing_inline_in_public_items = "allow"
rest_pattern_accessible_field = "allow"
print_stderr = "allow"
tests_outside_test_module = "allow"

[profile.release]
codegen-units = 1
lto = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.fast]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
incremental = true
